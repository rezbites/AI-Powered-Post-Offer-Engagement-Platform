[pytest]
testpaths = tests
pythonpath = .
# Domain tests are synchronous and pure; asyncio_mode=auto lets the later
# integration tests use async fixtures without per-test decorators.
asyncio_mode = auto
# Pin explicitly rather than inheriting a default that pytest-asyncio warns
# is changing in a future release.
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --tb=short
markers =
    integration: exercises the database or HTTP layer
    llm: calls a real LLM provider (skipped unless an API key is configured)
